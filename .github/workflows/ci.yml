name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run build

      - run: npm run build:check

      - run: npm run lint

      # Unit and end-to-end suites. The network suite stamps on a real gateway and
      # skips itself without UNICITY_TEST_API_KEY; see the README.
      - run: npm test
